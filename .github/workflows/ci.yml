name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: promptcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Check (Biome)
        run: pnpm run lint

      - name: Typecheck Monorepo (tsc)
        run: pnpm run typecheck

      - name: Setup Test Database Schema
        run: pnpm --filter @promptcheck/api run db:push --force
        env:
          DATABASE_URL: postgres://postgres:ci_test_password@localhost:5432/promptcheck

      - name: Run Unit & Integration Tests (Vitest)
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:ci_test_password@localhost:5432/promptcheck

      - name: Build Monorepo (tsup & vite)
        run: pnpm run build
