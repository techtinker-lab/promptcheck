name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Check (Biome)
        run: pnpm run lint

      - name: Typecheck Monorepo (tsc)
        run: pnpm run typecheck

      - name: Run Unit & Integration Tests (Vitest)
        run: pnpm test

      - name: Build Monorepo (tsup & vite)
        run: pnpm run build
